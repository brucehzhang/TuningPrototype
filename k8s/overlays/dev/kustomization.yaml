apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: tuningprototype
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tuningprototype
      spec:
        template:
          spec:
            containers:
              - name: tuningprototype
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: dev