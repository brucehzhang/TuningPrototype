apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tuningprototype-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "tuning_server_secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: "STRATEGY_TUNING_DB_ADMIN_USER"
            objectAlias: "STRATEGY_TUNING_DB_ADMIN_USER"
          - path: "STRATEGY_TUNING_DB_ADMIN_PASS"
            objectAlias: "STRATEGY_TUNING_DB_ADMIN_PASS"
          - path: "APCA_TRADING_KEY_ID"
            objectAlias: "APCA_TRADING_KEY_ID"
          - path: "APCA_TRADING_SECRET_KEY"
            objectAlias: "APCA_TRADING_SECRET_KEY"
  secretObjects:
    - secretName: tuningprototype-db-secret
      type: Opaque
      data:
        - objectName: STRATEGY_TUNING_DB_ADMIN_USER
          key: STRATEGY_TUNING_DB_ADMIN_USER
        - objectName: STRATEGY_TUNING_DB_ADMIN_PASS
          key: STRATEGY_TUNING_DB_ADMIN_PASS
        - objectName: APCA_TRADING_KEY_ID
          key: APCA_TRADING_KEY_ID
        - objectName: APCA_TRADING_SECRET_KEY
          key: APCA_TRADING_SECRET_KEY
