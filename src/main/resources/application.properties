spring.application.name=TuningPrototype
server.port=8080
app.datasource.url=jdbc:mysql://localhost:3306/strategy_tuning_db
app.datasource.username=${STRATEGY_TUNING_DB_ADMIN_USER}
app.datasource.password=${STRATEGY_TUNING_DB_ADMIN_PASS}
app.datasource.configuration.maximum-pool-size=30

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# MCP Properties
spring.ai.mcp.server.protocol=STREAMABLE