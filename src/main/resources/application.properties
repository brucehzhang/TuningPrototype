spring.application.name=TuningPrototype
server.port=8080
app.datasource.url=jdbc:mysql://localhost:3306/strategy_tuning_db
app.datasource.username=${STRATEGY_TUNING_DB_ADMIN_USER}
app.datasource.password=${STRATEGY_TUNING_DB_ADMIN_PASS}
app.datasource.configuration.maximum-pool-size=30

# AWS credentials, uses default credential provider through these properties.
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# LocalStack endpoint to be autoconfigured for local testing
spring.cloud.aws.endpoint=http://localhost:4566

# Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# MCP Properties
spring.ai.mcp.server.protocol=STREAMABLE