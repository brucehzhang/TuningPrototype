server:
  port: 8080

app:
  datasource:
    url: jdbc:mysql://strategy-tuning-db-instance.cv26muqooyrk.ap-southeast-2.rds.amazonaws.com:3306/strategy_tuning_db?serverTimezone=UTC&useSSL=true&requireSSL=true&verifyServerCertificate=true&trustCertificateKeyStoreUrl=file:/etc/tuning-prototype/certs/rds-truststore.jks&trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}
    username: ${STRATEGY_TUNING_DB_ADMIN_USER}
    password: ${STRATEGY_TUNING_DB_ADMIN_PASS}
    configuration:
      maximum-pool-size: 30
      driver-class-name: com.mysql.cj.jdbc.Driver
