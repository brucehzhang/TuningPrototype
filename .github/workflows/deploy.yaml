name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: 22ng/tuningprototype
  ECR_REGISTRY: 102001485020.dkr.ecr.ap-southeast-2.amazonaws.com
  TARGET_TAG_KEY: Application
  TARGET_TAG_VALUE: tuningprototype   # every EC2 instance running this app must be tagged Application=tuningprototype

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102001485020:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (SHA-tagged only, no :latest)
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::102001485020:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (fans out to all tagged instances)
        run: |
          set -e

          # Discover every instance currently matching the tag, so we know
          # exactly which instances we're waiting on below.
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:${{ env.TARGET_TAG_KEY }},Values=${{ env.TARGET_TAG_VALUE }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found with tag ${{ env.TARGET_TAG_KEY }}=${{ env.TARGET_TAG_VALUE }}"
            exit 1
          fi

          echo "Deploying to instances: $INSTANCE_IDS"

          # Bake this run's image tag into the script, then base64-encode the
          # whole thing so it crosses the YAML/JSON boundary as a single opaque
          # string — no nested quoting to fight.
          sed "s|__IMAGE_TAG__|${{ github.sha }}|" scripts/remote-deploy.sh > /tmp/remote-deploy-resolved.sh
          ENCODED_SCRIPT=$(base64 -w 0 /tmp/remote-deploy-resolved.sh)

          cat > /tmp/ssm-params.json << EOF
          {
            "commands": ["echo ${ENCODED_SCRIPT} | base64 -d | bash"]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:${{ env.TARGET_TAG_KEY }},Values=${{ env.TARGET_TAG_VALUE }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for and check each instance individually — send-command with
          # --targets doesn't support a single combined "wait", so we poll
          # per instance and fail the whole job if any one of them fails.
          OVERALL_STATUS=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting on $INSTANCE_ID..."
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" || true

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)

            echo "$INSTANCE_ID -> $STATUS"

            if [ "$STATUS" != "Success" ]; then
              echo "Deployment failed on $INSTANCE_ID"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' --output text
              OVERALL_STATUS=1
            fi
          done

          if [ "$OVERALL_STATUS" -ne 0 ]; then
            echo "One or more instances failed to deploy — see logs above."
            exit 1
          fi

          echo "Deployment succeeded and health check passed on all instances."